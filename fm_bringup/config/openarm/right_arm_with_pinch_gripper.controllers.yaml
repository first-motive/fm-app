# OpenArm controllers for the right_arm_with_pinch_gripper preset: the 7-DOF right arm PLUS
# the pinch gripper. Same arm controller as right_arm.controllers.yaml, with an added 1-DOF
# gripper controller on openarm_right_finger_joint1 (finger_joint2 mimics it in the URDF and
# in the MuJoCo model, so only joint1 is commanded).
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — software-GL MuJoCo on a headless Mac cannot hold 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    openarm_right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    openarm_right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

openarm_right_arm_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true

openarm_right_gripper_controller:
  ros__parameters:
    joints:
      - openarm_right_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
